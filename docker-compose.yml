version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: /app/scripts/start-backend.sh

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: /app/scripts/start-worker.sh
    env_file:
      - .env
    depends_on:
      - db
      - redis

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: /app/scripts/start-scheduler.sh
    env_file:
      - .env
    depends_on:
      - db
      - redis

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: life_os
      POSTGRES_USER: life_os
      POSTGRES_PASSWORD: life_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
